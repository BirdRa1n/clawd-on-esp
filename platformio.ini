; clawd-on-esp — ESP32 display client for the Clawd mascot (Mobile Protocol v1)
; See docs/clawd-esp32/ for the architecture & protocol analysis.

[platformio]
default_envs = esp32-2432S028

; ── Shared base ─────────────────────────────────────────────────────────────
[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
lib_deps =
    bodmer/TFT_eSPI @ ^2.5.43
    links2004/WebSockets @ ^2.4.1        ; Phase 2 — WebSocket client
    bblanchon/ArduinoJson @ ^7.0.4       ; Phase 2 — protocol parsing
    ; Phase 3 uses a custom palette-indexed RLE format (CRLI) decoded in
    ; src/animation_manager.cpp — no GIF library needed.

; ── Plain dev board (placeholder / no display) ──────────────────────────────
[env:esp32dev]
board = esp32dev

; ── Cheap Yellow Display 2432S028R (ILI9341 + 8 MB PSRAM) — MAIN TARGET ──────
[env:esp32-2432S028]
board = esp32dev
board_build.partitions = partitions.csv  ; ~1.94MB app + 2MB LittleFS (assets), no OTA
board_build.filesystem = littlefs
build_flags =
    ; --- Memory note ---
    ; Bring-up confirmed this unit is an ESP32-D0WD-V3 (WROOM, NO PSRAM), 4 MB flash,
    ; ~297 KB free heap. Design follows the no-PSRAM plan: curated GIFs in LittleFS,
    ; one animation in RAM at a time, draw straight to the TFT (no full framebuffer).

    ; --- TFT_eSPI display config for the CYD (ILI9341, HSPI) ---
    -D USER_SETUP_LOADED=1
    -D ILI9341_2_DRIVER=1                 ; if screen stays blank/garbled, try ST7789_DRIVER
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=320
    -D TFT_MISO=12
    -D TFT_MOSI=13
    -D TFT_SCLK=14
    -D TFT_CS=15
    -D TFT_DC=2
    -D TFT_RST=-1
    -D TFT_BL=21
    -D TFT_BACKLIGHT_ON=HIGH
    -D TFT_RGB_ORDER=TFT_BGR              ; confirmed correct on this unit (RED shows as its inverse, not swapped)
    -D TFT_INVERSION_ON                   ; confirmed needed: without it colours are photo-negative

    ; --- Fonts ---
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    -D LOAD_FONT6=1
    -D LOAD_FONT7=1
    -D LOAD_FONT8=1
    -D LOAD_GFXFF=1
    -D SMOOTH_FONT=1

    ; --- SPI clocks ---
    -D SPI_FREQUENCY=40000000
    -D SPI_READ_FREQUENCY=20000000
    -D SPI_TOUCH_FREQUENCY=2500000
